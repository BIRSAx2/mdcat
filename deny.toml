[graph]
targets = [
  { triple = 'x86_64-unknown-linux-gnu' },
  { triple = 'x86_64-apple-darwin' },
  { triple = 'x86_64-pc-windows-msvc' },
]

[advisories]
version = 2
ignore = [
    "RUSTSEC-2025-0141",
    "RUSTSEC-2024-0436",
    # ttf-parser is unmaintained but no upgrade path exists; comes through resvg and ratex-render
    "RUSTSEC-2026-0192",
    # rustybuzz is unmaintained; pulled in transitively via resvg -> usvg for SVG image
    # support. No direct dependency and no upgrade path (harfrust migration not yet
    # available in resvg).
    "RUSTSEC-2026-0206",
    # unsafe-libyaml is unmaintained; pulled in transitively via merman-core -> serde_yaml for
    # Mermaid diagram parsing. No direct dependency and no safe upgrade available.
    "RUSTSEC-2024-0449",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "MPL-2.0",
    "Zlib",
    "LPPL-1.3c",
    "Unicode-3.0",
    "ISC",
    "CC0-1.0",
]

[bans]
multiple-versions = "allow"
