name: Release

on:
  push:
    tags:
      - mdcat-*

jobs:
  build-manpage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker://asciidoctor/docker-asciidoctor
        with:
          args: asciidoctor -b manpage -a reproducible mdcat.1.adoc
      - uses: actions/upload-artifact@v7
        with:
          name: mdcat.1
          path: mdcat.1

  build-binaries:
    runs-on: "${{ matrix.os }}"
    needs: build-manpage
    permissions:
      id-token: write
      contents: read
      attestations: write
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/download-artifact@v4
        with:
          path: ./artifacts
      - run: mv artifacts/mdcat.1 .
      # The curl crate links OpenSSL on macOS too, but calls no OpenSSL function there, as it uses
      # the libcurl of macOS.  The OpenSSL from Homebrew on the runner is not on other Macs, so
      # link it statically, which puts no OpenSSL code into the binary.
      - run: echo 'OPENSSL_STATIC=1' >>"${GITHUB_ENV}"
        if: ${{ contains(matrix.target, 'apple') }}
      - run: cargo build --locked --target '${{ matrix.target }}' --release
      - run: strip 'target/${{ matrix.target }}/release/mdcat'
        if: ${{ !contains(matrix.target, 'windows') }}
      # macOS on Apple Silicon only runs signed binaries.  Current Apple strip keeps the ad-hoc
      # signature of the linker valid; sign again anyway, so that a runner image with a strip
      # that does not keep it still makes a binary that runs.  Then verify the signature, and
      # check that the binary only links libraries which are part of macOS.
      - name: Sign and check macOS binary
        if: ${{ contains(matrix.target, 'apple') }}
        shell: bash
        run: |
          bin='target/${{ matrix.target }}/release/mdcat'
          codesign --force --sign - "${bin}"
          codesign --verify --verbose "${bin}"
          otool -L "${bin}"
          if otool -L "${bin}" | tail -n +2 | grep -Ev '^[[:space:]]+(/usr/lib/|/System/Library/)'; then
            echo '::error::mdcat links libraries which are not part of macOS'
            exit 1
          fi
          "${bin}" --version
      - id: version
        shell: bash
        run: |
          echo "version=$(cargo pkgid | cut -d'#' -f2 | cut -d: -f2)" >>"${GITHUB_OUTPUT}"
      - id: package
        shell: bash
        run: ./scripts/package '${{ steps.version.outputs.version }}' '${{ matrix.target }}'
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.package.outputs.file }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.file }}

  create-release:
    runs-on: ubuntu-latest
    needs: build-binaries
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: ./artifacts
      - run: mkdir ./assets
      - run: mv ./artifacts/*/*.{zip,tar.gz} ./assets
      - run: b2sum *.{zip,tar.gz} > B2SUMS.txt
        working-directory: assets
      - id: version
        shell: bash
        run: |
          echo "version=$(cargo pkgid | cut -d'#' -f2 | cut -d: -f2)" >>"${GITHUB_OUTPUT}"
      - name: Extract changelog
        shell: bash
        run: |
          awk -v r='${{ steps.version.outputs.version }}' \
            '/^\[[^]]*\]/{print $0}/^## \[[0-9]/ && match($0, /\[[0-9][^]]*\]/){if (r == substr($0, RSTART+1, RLENGTH-2)) { p=1; next } else { p=0 } }p' \
            CHANGELOG.md > ./CHANGELOG-release.md
          cat CHANGELOG-release.md
      - uses: softprops/action-gh-release@v2
        with:
          name: mdcat-${{ steps.version.outputs.version }}
          body_path: ./CHANGELOG-release.md
          files: "./assets/*"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
